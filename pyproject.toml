[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-source-business-etl-pipeline"
version = "0.1.0"
description = "A modular Python ETL pipeline for multi-source retail data integration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

